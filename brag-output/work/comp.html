<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#a8d51e; --green-dark:#648b1c; --highlight:#d8f24a;
    --ink:#101214; --cream:#fcfcfa; --border:#e5e8e2; --amber:#f5a623;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0b0d0f}

  .shot{position:absolute;inset:0;opacity:0;will-change:transform,opacity}
  .shot video{position:absolute;top:0;left:0;width:1920px;height:1080px;object-fit:cover;
    transform-origin:50% 50%;will-change:transform}
  .tz{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}
  .tz video{transform:none!important}

  /* privacy: the contact column in the Leads shot holds live small-business phone numbers */
  #privacy{position:absolute;left:974px;top:172px;width:92px;height:430px;
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;border-radius:5px}

  /* hook type */
  #hook{position:absolute;left:112px;top:0;width:940px;height:1080px;
    display:flex;flex-direction:column;justify-content:center;gap:26px;opacity:0}
  #hook h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:84px;
    line-height:1.02;letter-spacing:-0.035em;color:#fff;text-shadow:0 8px 40px rgba(0,0,0,.65)}
  #hook .rule{width:96px;height:7px;background:var(--green);border-radius:4px;transform-origin:left center}

  /* caption pill */
  #cap{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);
    display:flex;align-items:center;gap:18px;padding:20px 38px 21px;border-radius:999px;
    background:rgba(13,15,17,.94);box-shadow:0 18px 60px rgba(10,16,26,.42);opacity:0;white-space:nowrap}
  #cap .dot{width:12px;height:12px;border-radius:999px;background:var(--green);flex:none}
  #cap span{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:36px;
    letter-spacing:-0.02em;color:#fff}

  /* a short dip through flat colour at each cut — never a dissolve between two busy layouts */
  #dip{position:absolute;inset:0;opacity:0;pointer-events:none;background:#fcfcfa}

  /* vignette for the dark map scenes */
  #vig{position:absolute;inset:0;opacity:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%, rgba(0,0,0,0) 38%, rgba(0,0,0,.66) 100%)}

  /* outro */
  #outro{position:absolute;inset:0;background:var(--cream);opacity:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
  #outro img{width:520px;display:block}
  #outro h2{margin-top:56px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;
    font-size:78px;letter-spacing:-0.035em;color:var(--ink);text-align:center;line-height:1.08}
  #outro h2 em{font-style:normal;position:relative;z-index:1;white-space:nowrap}
  #outro h2 em:before{content:"";position:absolute;left:-10px;right:-10px;bottom:6px;height:38px;
    background:var(--highlight);z-index:-1;border-radius:3px;transform-origin:left center}
  #outro .url{margin-top:40px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;
    font-size:30px;letter-spacing:0.02em;color:var(--green-dark)}
  #outro .sub{margin-top:14px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;
    font-size:23px;letter-spacing:0.01em;color:#667085}
</style>
</head>
<body>
<div id="stage">
  <div class="shot" id="sA"><video id="vA" src="A.mp4" muted preload="auto"></video></div>
  <div class="shot" id="sB"><video id="vB" src="B.mp4" muted preload="auto"></video></div>
  <div class="shot" id="sC"><video id="vC" src="C.mp4" muted preload="auto"></video></div>
  <div class="shot" id="sD"><video id="vD" src="D.mp4" muted preload="auto"></video></div>
  <div class="shot" id="sE"><div class="tz" id="zE"><video id="vE" src="E.mp4" muted preload="auto"></video><div id="privacy"></div></div></div>

  <div id="dip"></div>
  <div id="vig"></div>
  <div id="hook"><h1>Which businesses<br>are worth calling?</h1><div class="rule"></div></div>
  <div id="cap"><i class="dot"></i><span id="capText"></span></div>

  <div id="outro">
    <img src="wordmark.png" alt="mantis">
    <h2>Find businesses<br><em>ready to buy.</em></h2>
    <div class="url">mantisai.in</div>
    <div class="sub">Intent-based lead intelligence for agencies and MSMEs</div>
  </div>
</div>

<script>
const FPS = 30, DUR = 23.0;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lin=(t,a,b)=>clamp((t-a)/(b-a),0,1);
// smooth in/out
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const easeOut=x=>1-Math.pow(1-x,3);
// fade window: 0 before a, 1 between a+fi and b-fo, 0 after b
function win(t,a,b,fi,fo){ if(t<a||t>b) return 0; return Math.min(lin(t,a,a+fi), 1-lin(t,b-fo,b)); }

// Every scene: [element, video, start, end, clipStart, rate, zoomFrom, zoomTo, originX, originY]
const SC = [
  { el:'sA', v:'vA', t0:0.00, t1:5.00, c0:0.05, rate:1.00, z0:1.05, z1:1.14, ox:58, oy:38 },
  { el:'sB', v:'vB', t0:5.00, t1:9.40, c0:0.30, rate:2.36, z0:1.60, z1:1.74, ox:56, oy:28, dy:165 },
  { el:'sC', v:'vC', t0:9.40, t1:13.60, c0:0.90, rate:1.22, z0:1.34, z1:1.18, ox:56, oy:26 },
  { el:'sD', v:'vD', t0:13.60, t1:16.80, c0:1.60, rate:2.00, z0:1.22, z1:1.32, ox:56, oy:40, dx:-45 },
  { el:'sE', v:'vE', t0:16.80, t1:20.00, c0:0.55, rate:1.50, z0:1.16, z1:1.26, ox:50, oy:18, zone:'zE' },
];

// Captions: text, in, out
const CAPS = [
  { s:2.80, e:5.00, txt:'Signals tell you why.' },
  { s:9.90, e:13.60, txt:'Every lead, scored.' },
  { s:13.95, e:16.80, txt:'Add the ones you want.', top:true },
  { s:17.15, e:20.00, txt:'Contacts, ready to work.' },
];

const $ = id => document.getElementById(id);

async function seek(video, time){
  if (Math.abs(video.currentTime - time) < 0.0005 && video.readyState >= 2) return;
  await new Promise((res, rej) => {
    const ok = () => { video.removeEventListener('seeked', ok); res(); };
    video.addEventListener('seeked', ok);
    video.currentTime = time;
    setTimeout(res, 3000);
  });
}

window.setT = async function(t){
  // --- scenes
  for (const s of SC){
    const el = $(s.el), v = $(s.v);
    const on = t >= s.t0 - 0.001 && t < s.t1 - 0.0005;
    if (!on){ el.style.opacity = 0; continue; }
    const local = clamp(t - s.t0, 0, (s.t1 - s.t0));
    await seek(v, s.c0 + local * s.rate);
    // hard cut; only the very first frames rise out of black
    el.style.opacity = 1;   // opens on picture, so frame 0 can carry the poster
    const p = ease(clamp(local / (s.t1 - s.t0), 0, 1));
    const z = s.z0 + (s.z1 - s.z0) * p;
    const tgt = s.zone ? $(s.zone) : v;
    tgt.style.transformOrigin = s.ox + '% ' + s.oy + '%';
    tgt.style.transform = 'translate(' + (s.dx||0) + 'px,' + (s.dy||0) + 'px) scale(' + z.toFixed(4) + ')';
  }

  // --- dip: a blink of flat colour across each cut, tinted to whatever follows it
  const DIPS = [ {t:5.00, c:'#fcfcfa'}, {t:9.40, c:'#fcfcfa'}, {t:13.60, c:'#fcfcfa'},
                 {t:16.80, c:'#fcfcfa'}, {t:20.00, c:'#fcfcfa'} ];
  let dv = 0;
  for (const d of DIPS){
    const a = 1 - Math.min(1, Math.abs(t - d.t) / 0.085);
    if (a > dv){ dv = a; $('dip').style.background = d.c; }
  }
  $('dip').style.opacity = Math.max(0, dv) * 0.92;

  // --- vignette only over the dark map
  $('vig').style.opacity = win(t, 0, 5.15, 0.30, 0.35);

  // --- hook
  const hv = win(t, 0.30, 2.62, 0.42, 0.34);
  $('hook').style.opacity = hv;
  const hp = easeOut(lin(t, 0.30, 1.35));
  $('hook').style.transform = 'translateY(' + ((1 - hp) * 26).toFixed(2) + 'px)';
  $('hook').querySelector('.rule').style.transform = 'scaleX(' + easeOut(lin(t, 0.62, 1.42)).toFixed(3) + ')';

  // --- caption
  let cv = 0, ctext = '', ctop = false;
  for (const c of CAPS){
    const a = win(t, c.s, c.e, 0.30, 0.30);
    if (a > cv){ cv = a; ctext = c.txt; ctop = !!c.top; }
  }
  if (ctext) $('capText').textContent = ctext;
  const cap = $('cap');
  cap.style.opacity = cv;
  cap.style.bottom = ctop ? 'auto' : '84px';
  cap.style.top = ctop ? '78px' : 'auto';
  cap.style.transform = 'translateX(-50%) translateY(' + ((1 - cv) * (ctop ? -14 : 14)).toFixed(2) + 'px)';

  // --- privacy blur rides with the Leads shot
  $('privacy').style.opacity = t > 16.9 ? 1 : 0;

  // --- outro
  const ov = t >= 20.00 ? 1 : 0;
  const o = $('outro');
  o.style.opacity = ov;
  const op = easeOut(lin(t, 20.05, 20.95));
  o.querySelector('img').style.transform = 'translateY(' + ((1 - op) * 18).toFixed(2) + 'px)';
  o.querySelector('img').style.opacity = lin(t, 20.05, 20.55);
  const hp2 = easeOut(lin(t, 20.25, 21.15));
  o.querySelector('h2').style.opacity = lin(t, 20.25, 20.80);
  o.querySelector('h2').style.transform = 'translateY(' + ((1 - hp2) * 16).toFixed(2) + 'px)';
  const mark = easeOut(lin(t, 20.85, 21.55));
  o.querySelector('h2 em').style.setProperty('--m', mark);
  o.querySelector('h2 em').style.cssText = '--m:' + mark;
  const em = o.querySelector('h2 em');
  em.style.setProperty('background-size', '0');
  // animate the highlighter by scaling its pseudo element through a CSS var
  document.documentElement.style.setProperty('--markscale', mark.toFixed(3));
  o.querySelector('.url').style.opacity = lin(t, 21.20, 21.75);
  o.querySelector('.sub').style.opacity = lin(t, 21.45, 22.00);
};

// highlighter scale driven by --markscale
const sheet = document.createElement('style');
sheet.textContent = '#outro h2 em:before{transform:scaleX(var(--markscale,0))}';
document.head.appendChild(sheet);

window.ready = async function(){
  await document.fonts.ready;
  const vids = [...document.querySelectorAll('video')];
  await Promise.all(vids.map(v => new Promise(res => {
    if (v.readyState >= 3) return res();
    v.addEventListener('canplaythrough', res, {once:true});
    v.addEventListener('loadeddata', res, {once:true});
    setTimeout(res, 15000);
  })));
  const img = document.querySelector('#outro img');
  if (!img.complete) await new Promise(r => { img.onload = r; img.onerror = r; });
  return true;
};
window.TOTAL_FRAMES = Math.round(DUR * FPS);
</script>
</body>
</html>
